     Row one puts the agents between the tasks they shape and the environment they act in.
     In "Agent interaction", information is a token that changes shape each time an agent passes it on.
     A brace under that scene opens onto row two: one animated figure per collaboration policy.
     The time axis at the bottom holds three rounds, a tick where each one starts, and is the playhead;
     a button beside it pauses the block, and a click or drag on the axis moves to that moment.
     Every round is one full execution: the row-one scenes play once per round, and each policy figure
     plays its round. Defined links are solid and repeat every round,
     and a rule is a small tag on a link (if, else, if fail); links that emerged from the agents are
     dashed and belong to a single round.
     Motion is defined in _sass/layout/_research.scss and only runs when the visitor has not asked for reduced motion. -->

      <div class="research-fun-time-axis"><i></i><span class="rf-bound rf-bound--1"></span><span class="rf-bound rf-bound--2"></span><span class="rf-bound rf-bound--3"></span></div>
      <svg viewBox="0 0 10 10" focusable="false"><path d="M1,1 L9,5 L1,9 Z"/></svg>

    <p><svg viewBox="0 0 34 10" aria-hidden="true" focusable="false"><line x1="1" y1="5" x2="31" y2="5" class="rf-line rf-accent rf-dashed" marker-end="url(#rf-arrow-accent)"/></svg>emerged</p>

<script>
  /* Timeline controls for the illustrations: the button pauses and resumes every animation in the block,
     and a click or a drag along the time axis moves all of them to that moment.
     The button is hidden without this script and when the visitor asked for reduced motion (see _research.scss).
     Comments here are block comments on purpose: the live site compresses its HTML onto one line
     (compress_html in _config.yml), and a line comment would then swallow the code after it. */
  (function () {
    var block = document.querySelector(".research-fun");
    if (!block || !block.getAnimations) { return; }
    var button = block.querySelector(".research-fun-play");
    var line = block.querySelector(".research-fun-time-line");
    var axis = block.querySelector(".research-fun-time-axis");
    var playhead = axis.querySelector("i");

    button.addEventListener("click", function () {
      var paused = block.classList.toggle("is-paused");
      button.setAttribute("aria-label", paused ? "Play the animation" : "Pause the animation");
    });

    /* the playhead crosses the axis once per loop, so its duration is the length of the loop */
    function seek(event) {
      var running = playhead.getAnimations()[0];
      if (!running) { return; }
      var box = axis.getBoundingClientRect();
      var share = Math.min(Math.max((event.clientX - box.left) / box.width, 0), 0.999);
      var time = share * running.effect.getComputedTiming().duration;
      block.getAnimations({ subtree: true }).forEach(function (animation) { animation.currentTime = time; });
    }

    line.addEventListener("pointerdown", function (event) {
      line.setPointerCapture(event.pointerId);
      seek(event);
    });
    line.addEventListener("pointermove", function (event) {
      if (line.hasPointerCapture(event.pointerId)) { seek(event); }
    });
  })();
</script>

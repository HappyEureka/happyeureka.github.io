<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEA teaser: record the scroll, roll it up, infuse a new policy</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: white; color: #202631;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1400px; margin: 0 auto; padding: 10px 12px 10px; background: white; }
  svg { width: 100%; height: auto; display: block; }
  svg text { font-family: Georgia, "Times New Roman", serif; fill: #252831; }
  .status {
    display: flex; gap: 12px; align-items: flex-start;
    min-height: 56px; padding: 9px 13px; margin-top: 6px;
    background: #f1f5f2; border-radius: 9px; line-height: 1.45; font-size: 14px;
  }
  .status .phase { flex: 0 0 auto; font-weight: 700; color: #2c5a3c; white-space: nowrap; }
  .status .text { color: #384150; }
  .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 9px; }
  button {
    font: inherit; font-size: 13px; padding: 6px 11px; border: 1px solid #cbd2dd;
    border-radius: 7px; background: white; cursor: pointer; color: #202631;
  }
  #play { background: #3f7f55; color: white; border-color: #3f7f55; min-width: 66px; }
  .chip { border-radius: 999px; padding: 5px 11px; color: #4a5568; }
  .chip.on { background: #e8f3ea; border-color: #9cc4a8; color: #2c5a3c; font-weight: 600; }
  input[type=range] { flex: 1; min-width: 140px; accent-color: #3f7f55; }
  #clock { font-variant-numeric: tabular-nums; color: #667085; font-size: 13px; }
  button:focus-visible, input:focus-visible { outline: 3px solid rgba(63, 127, 85, 0.3); outline-offset: 2px; }
  @media (max-width: 700px) {
    main { padding: 6px 6px 8px; }
    .status { font-size: 12.5px; min-height: 0; padding: 8px 10px; gap: 8px; }
    button { font-size: 12px; padding: 5px 9px; }
  }
</style>
</head>
<body>
<main>
  <svg id="scene" viewBox="0 0 1200 560" role="img"
       aria-label="A scroll unrolls while agents collaborate, recording tasks, agent activations, and environment changes. Rolling the scroll back up merges each agent's activations into a node and tallies messages into weighted edges, recovering the collaboration topology and rules. The rolled record steeps in a teapot, which pours out a proposed policy for the next episode.">
    <defs id="defs"></defs>
  </svg>
  <div class="status">
    <span class="phase" id="phase">1 · Execute</span>
    <span class="text" id="text"></span>
  </div>
  <div class="controls">
    <button id="play">Pause</button>
    <button id="replay">Replay</button>
    <button class="chip" data-scene="0">1 Execute</button>
    <button class="chip" data-scene="1">2 Recover</button>
    <button class="chip" data-scene="2">3 Infuse</button>
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Timeline">
    <span id="clock">0:00 / 0:18</span>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) { if (k === "text") n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]); }
  if (parent) parent.appendChild(n);
  return n;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const lerp = (a, b, p) => a + (b - a) * p;
const easeInOut = p => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
const easeOut = p => 1 - Math.pow(1 - p, 3);
const quad = (p0, c, p1, p) => [
  (1 - p) * (1 - p) * p0[0] + 2 * (1 - p) * p * c[0] + p * p * p1[0],
  (1 - p) * (1 - p) * p0[1] + 2 * (1 - p) * p * c[1] + p * p * p1[1]
];

/* ---------- palette & geometry ---------- */
const C = {
  task: "#e8735a", taskEv: "#f0a04b", env: "#7b93c9", envEv: "#3b5998", comm: "#ffffff",
  gen: "#7c4dbd", def: "#2f5aa8", ink: "#4a5568", paper: "#fdf9f0", paperEdge: "#d9cdb4",
  wood: "#6b4a2b", woodDark: "#3d2614", woodLight: "#a67c52", green: "#3f7f55", tea: "#b8863b",
  bandT: "#fff3dc", bandD: "#eef3f7", bandZ: "#e9f0fb", act: "#f3f5f9", actOn: "#e4edfb",
  good: "#3f7f55", bad: "#c0392b", open: "#d08a1e", gray: "#9aa3ad"
};
const X0 = 135, XS = 102, UMAX = 9.6;
const xOf = u => X0 + XS * u;
const PAPER_X = 83, PAPER_Y = 100, PAPER_H = 370, PAPER_B = PAPER_Y + PAPER_H;
const ROW = { P: 232, W1: 272, W2: 312, W3: 352, V: 392 };
const TASK = { k1: 122, k2: 145, k3: 168, k4: 191 };
const ZY = 444;
const XMAX = xOf(UMAX);       // fully unrolled front
const XROLLED = PAPER_X + 9;  // rolled-up front: rollers nearly touching
const ROLL_CX = 89;           // centre of the rolled scroll (both rollers)

/* ---------- the story on the scroll ---------- */
const ACTS = [
  { id: "h1", agent: "P",  us: 0.0, ue: 1.2, tools: [[0.2, "task"], [0.6, "task"], [1.0, "comm"]] },
  { id: "h2", agent: "W1", us: 1.4, ue: 3.4, tools: [[1.7, "env"], [2.3, "task"], [2.7, "comm"], [3.2, "comm"]] },
  { id: "h3", agent: "W2", us: 1.5, ue: 3.6, tools: [[1.9, "env"], [2.6, "task"], [3.4, "comm"]] },
  { id: "h4", agent: "W3", us: 1.6, ue: 3.5, tools: [[2.0, "env"], [2.5, "task"], [3.3, "comm"]] },
  { id: "h5", agent: "V",  us: 3.8, ue: 5.0, tools: [[4.1, "env"], [4.5, "task"], [4.8, "comm"]] },
  { id: "h6", agent: "P",  us: 5.2, ue: 5.9, tools: [[5.6, "comm"]] },
  { id: "h7", agent: "W3", us: 6.1, ue: 7.2, tools: [[6.4, "env"], [6.8, "task"], [7.0, "comm"]] },
  { id: "h8", agent: "V",  us: 7.4, ue: 8.4, tools: [[7.7, "env"], [8.0, "task"], [8.2, "comm"]] },
  { id: "h9", agent: "P",  us: 8.6, ue: 9.4, tools: [[8.9, "task"], [9.2, "task"]] }
];
const MSGS = [
  { f: "P", t: "W1", us: 1.0, ur: 1.4 }, { f: "P", t: "W2", us: 1.0, ur: 1.5 }, { f: "P", t: "W3", us: 1.0, ur: 1.6 },
  { f: "W1", t: "W2", us: 2.7, ur: 2.9 },
  { f: "W1", t: "V", us: 3.2, ur: 3.8 }, { f: "W2", t: "V", us: 3.4, ur: 3.8 }, { f: "W3", t: "V", us: 3.3, ur: 3.8 },
  { f: "V", t: "P", us: 4.8, ur: 5.2, def: true },
  { f: "P", t: "W3", us: 5.6, ur: 6.1 },
  { f: "W3", t: "V", us: 7.0, ur: 7.4 },
  { f: "V", t: "P", us: 8.2, ur: 8.6, def: true }
];
const TEV = [
  { row: "k1", u: 0.2, kind: "open", label: "open" },
  { row: "k1", u: 0.6, kind: "split", label: "split" },
  { row: "k2", u: 2.3, kind: "update", label: "update" },
  { row: "k3", u: 2.6, kind: "update" },
  { row: "k4", u: 2.5, kind: "update" },
  { row: "k1", u: 4.5, kind: "attach", label: "attach fail", bad: true },
  { row: "k4", u: 6.8, kind: "update" },
  { row: "k1", u: 8.0, kind: "attach", label: "attach pass" },
  { row: "k1", u: 8.9, kind: "join", label: "join" },
  { row: "k1", u: 9.2, kind: "close", label: "close" }
];
const ZEV = [[1.7, ""], [1.9, ""], [2.0, ""], [4.1, "run tests"], [6.4, "edit"], [7.7, "run tests"]];
const BEATS = [
  [0.0, "P activates."],
  [0.2, "P opens k1."],
  [0.6, "P splits k1 → k2, k3, k4."],
  [1.0, "P → workers. Dashed: not in the policy."],
  [1.7, "Workers edit files, update tasks."],
  [2.7, "W1 → W2: unprescribed."],
  [3.2, "Workers → V."],
  [4.1, "V tests: fail, attached to k1."],
  [4.8, "V → P. Solid: defined in the policy."],
  [5.6, "P → W3: fix it."],
  [6.4, "W3 edits again."],
  [7.7, "V tests: pass."],
  [8.9, "P joins and closes k1. Done."]
];
const NODE = { P: [1000, 175], W1: [900, 275], W2: [1000, 275], W3: [1100, 275], V: [1000, 375] };
const NODE2 = { P: [960, 150], W1: [890, 225], W2: [960, 225], W3: [1030, 225], V: [960, 300] };

const S1 = 2.7, S2 = 5.7, S3 = 9.6, TOTAL = S1 + S2 + S3;   // Recover: 4.2 s roll + 1.5 s hold; Infuse paced by S3_MAP below

/* ---------- build the scene ---------- */
const svg = $("scene"), defs = $("defs");
function marker(id, color, w) {
  const m = el("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: w, markerHeight: w,
    orient: "auto", markerUnits: "userSpaceOnUse" }, defs);
  el("path", { d: "M0,0 L10,5 L0,10 Z", fill: color }, m);
}
marker("mGen", C.gen, 9); marker("mDef", C.def, 9); marker("mInk", C.ink, 10); marker("mBlue", C.def, 8);
marker("mGood", C.good, 8); marker("mBad", C.bad, 8); marker("mOpen", C.open, 8); marker("mGray", C.gray, 8);
const clip = el("clipPath", { id: "paperClip" }, defs);
const clipRect = el("rect", { x: PAPER_X, y: PAPER_Y - 6, width: 10, height: PAPER_H + 12 }, clip);
const cupClip = el("clipPath", { id: "cupClip" }, defs);
el("path", { d: "M-42,-40 L-34,42 C-33,52 -25,56 -15,56 L15,56 C25,56 33,52 34,42 L42,-40 Z" }, cupClip);
const woodGrad = el("linearGradient", { id: "wood", x1: 0, x2: 1, y1: 0, y2: 0 }, defs);
el("stop", { offset: "0", "stop-color": C.woodDark }, woodGrad);
el("stop", { offset: "0.45", "stop-color": C.woodLight }, woodGrad);
el("stop", { offset: "1", "stop-color": C.woodDark }, woodGrad);

/* legend (static, bottom) */
const legend = el("g", { transform: "translate(40 528)", "font-size": 13.5, fill: "#4a5568" }, svg);
function legendItem(x, draw, label) {
  const g = el("g", { transform: `translate(${x} 0)` }, legend); draw(g);
  el("text", { x: 22, y: 4, text: label, fill: "#4a5568" }, g);
}
legendItem(0, g => el("rect", { x: 0, y: -7, width: 16, height: 14, rx: 4, fill: C.act, stroke: C.ink, "stroke-width": 1.3 }, g), "activation");
legendItem(120, g => { el("rect", { x: 0, y: -6, width: 12, height: 12, rx: 2, fill: C.task, stroke: "#333" }, g); el("circle", { cx: 16, cy: 0, r: 5, fill: C.taskEv, stroke: "#333" }, g); }, "task tool · version");
legendItem(280, g => { el("rect", { x: 0, y: -6, width: 12, height: 12, rx: 2, fill: C.env, stroke: "#333" }, g); el("circle", { cx: 16, cy: 0, r: 5, fill: C.envEv, stroke: "#333" }, g); }, "env tool · env event / evidence");
legendItem(500, g => el("rect", { x: 0, y: -6, width: 12, height: 12, rx: 2, fill: C.comm, stroke: "#333" }, g), "comm tool");
legendItem(600, g => el("path", { d: "M0,0 H20", stroke: C.gen, "stroke-width": 2, "stroke-dasharray": "5 4", "marker-end": "url(#mGen)" }, g), "agent-generated");
legendItem(740, g => el("path", { d: "M0,0 H20", stroke: C.def, "stroke-width": 2.2, "marker-end": "url(#mDef)" }, g), "defined in policy Γ");
legendItem(900, g => el("path", { d: "M0,0 H20", stroke: C.ink, "stroke-width": 4, "marker-end": "url(#mInk)" }, g), "recovered edge · weight");

/* --- the scroll (卷轴) --- */
const gScroll = el("g", { id: "scroll" }, svg);
const ghostPaper = el("use", { href: "#paperContent", opacity: 0 }, gScroll);   // faint full record left behind while rolling up
const gPaperClip = el("g", { "clip-path": "url(#paperClip)" }, gScroll);
const gPaper = el("g", { id: "paperContent" }, gPaperClip);
el("rect", { x: PAPER_X, y: PAPER_Y, width: 1200, height: PAPER_H, fill: C.paper, stroke: C.paperEdge }, gPaper);
el("rect", { x: PAPER_X, y: 108, width: 1200, height: 92, fill: C.bandT }, gPaper);
el("rect", { x: PAPER_X, y: 208, width: 1200, height: 210, fill: C.bandD }, gPaper);
el("rect", { x: PAPER_X, y: 426, width: 1200, height: 36, fill: C.bandZ }, gPaper);
el("text", { x: 96, y: 162, text: "T", "font-size": 24, "font-style": "italic", "text-anchor": "middle", fill: "#c9682a" }, gPaper);
el("text", { x: 96, y: 320, text: "D", "font-size": 24, "font-style": "italic", "text-anchor": "middle", fill: "#55708c" }, gPaper);
el("text", { x: 96, y: 450, text: "Z", "font-size": 24, "font-style": "italic", "text-anchor": "middle", fill: C.envEv }, gPaper);
for (const k in TASK) el("text", { x: 126, y: TASK[k] + 4, text: k, "font-size": 12, "text-anchor": "end", fill: "#6b5a3e" }, gPaper);
for (const a in ROW) el("text", { x: 126, y: ROW[a] + 4, text: a, "font-size": 13, "text-anchor": "end", "font-weight": "bold", fill: "#3b4657" }, gPaper);
for (const a in ROW) el("path", { d: `M${X0},${ROW[a]} H1200`, stroke: "#d5dbe5", "stroke-dasharray": "3 6" }, gPaper);

const gConnect = el("g", { stroke: "#b8c0cc", "stroke-width": 1, "stroke-dasharray": "2 3", fill: "none" }, gPaper);
const gTask = el("g", {}, gPaper);
const gEnv = el("g", {}, gPaper);
const gMsg = el("g", { fill: "none" }, gPaper);
const gAct = el("g", {}, gPaper);
const gTaskNodes = el("g", {}, gPaper);

/* task rows: lines, branches, nodes */
el("path", { d: `M${xOf(0.2) + 14},${TASK.k1} H${xOf(9.2)}`, stroke: "#333", "stroke-width": 1.6, fill: "none" }, gTask);
for (const k of ["k2", "k3", "k4"]) {
  el("path", { d: `M${xOf(0.6) + 14},${TASK.k1} L${xOf(0.95)},${TASK[k]} H${xOf(8.55)} L${xOf(8.9) - 7},${TASK.k1}`, stroke: "#333", "stroke-width": 1.4, fill: "none" }, gTask);
  el("circle", { cx: xOf(0.95), cy: TASK[k], r: 5, fill: C.taskEv, stroke: "#333" }, gTask);
}
for (const e of TEV) {
  const x = xOf(e.u), y = TASK[e.row];
  el("rect", { x: x - 6, y: y - 6, width: 12, height: 12, rx: 2.5, fill: e.kind === "close" ? "#333" : C.task, stroke: "#333" }, gTaskNodes);
  if (e.kind !== "close") el("circle", { cx: x + 14, cy: y, r: 5.5, fill: e.kind === "attach" ? C.envEv : C.taskEv, stroke: "#333" }, gTaskNodes);
  if (e.label) el("text", { x: x + 2, y: y - 11, text: e.label, "font-size": 12, "text-anchor": "middle", "font-style": "italic",
    fill: e.bad ? "#c0392b" : (e.label === "attach pass" ? "#2c7a4b" : "#333") }, gTaskNodes);
}
/* environment row */
el("path", { d: `M${xOf(0.4)},${ZY} H${xOf(9.4)}`, stroke: C.envEv, "stroke-width": 1.6, "marker-end": "url(#mBlue)" }, gEnv);
for (const [u, label] of ZEV) {
  el("circle", { cx: xOf(u), cy: ZY, r: 5, fill: C.envEv, stroke: "#22355e" }, gEnv);
  if (label) el("text", { x: xOf(u), y: ZY + 16, text: label, "font-size": 12, "text-anchor": "middle", fill: "#33465f" }, gEnv);
}
el("text", { x: xOf(1.85), y: ZY + 16, text: "edits", "font-size": 12, "text-anchor": "middle", fill: "#33465f" }, gEnv);

/* activations */
const actEls = {};
for (const a of ACTS) {
  const x1 = xOf(a.us), x2 = xOf(a.ue), y = ROW[a.agent];
  const r = el("rect", { x: x1, y: y - 13, width: x2 - x1, height: 26, rx: 7, fill: C.act, stroke: C.ink, "stroke-width": 1.4 }, gAct);
  el("text", { x: x1 + 4, y: y - 16, text: a.id, "font-size": 9.5, "font-style": "italic", fill: "#6b7686" }, gAct);
  for (const [u, kind] of a.tools) {
    const tx = xOf(u);
    el("rect", { x: tx - 5, y: y - 5, width: 10, height: 10, rx: 2, fill: C[kind], stroke: "#333", "stroke-width": 1 }, gAct);
    if (kind === "task") { const t = TEV.find(e => Math.abs(e.u - u) < 1e-6); if (t) el("path", { d: `M${tx},${y - 13} V${TASK[t.row] + 7}` }, gConnect); }
    if (kind === "env") el("path", { d: `M${tx},${y + 13} V${ZY - 6}` }, gConnect);
  }
  actEls[a.id] = r;
}
/* messages */
for (const m of MSGS) {
  const yf = ROW[m.f], yt = ROW[m.t], down = yt > yf;
  const x1 = xOf(m.us), y1 = yf + (down ? 13 : -13), x2 = xOf(m.ur), y2 = yt + (down ? -13 : 13);
  const d = `M${x1},${y1} C${x1 + 36},${y1} ${x2 - 36},${y2} ${x2},${y2}`;
  el("path", { d, stroke: m.def ? C.def : C.gen, "stroke-width": m.def ? 2.2 : 2, "stroke-dasharray": m.def ? "" : "5 4",
    "marker-end": m.def ? "url(#mDef)" : "url(#mGen)" }, gMsg);
}
/* rollers */
function roller(x) {
  const g = el("g", {}, gScroll);
  el("rect", { x: x - 10, y: PAPER_Y - 22, width: 20, height: 12, rx: 4, fill: C.woodDark }, g);
  el("rect", { x: x - 10, y: PAPER_B + 10, width: 20, height: 12, rx: 4, fill: C.woodDark }, g);
  el("rect", { x: x - 13, y: PAPER_Y - 16, width: 26, height: PAPER_H + 32, rx: 13, fill: "url(#wood)", stroke: C.woodDark, "stroke-width": 1 }, g);
  return g;
}
roller(70);
const rollerR = roller(0);

/* --- episode clock (scene 1): the scroll is painted as time passes, not unrolled from a finished record --- */
const SEC_PER_U = 20;                 // one scroll unit = 20 s of episode time
const CLK = { x: 1160, y: 64 };
const gClock = el("g", { id: "wallclock", opacity: 0 }, svg);
const clockDigits = el("text", { x: CLK.x, y: CLK.y, text: "0:00", "font-size": 30, "text-anchor": "end", fill: "#2f3542",
  style: "font-variant-numeric: tabular-nums" }, gClock);
el("text", { x: CLK.x, y: CLK.y - 32, text: "live", "font-size": 14, "font-style": "italic", "text-anchor": "end", fill: "#6b7686" }, gClock);
const liveDot = el("circle", { cx: CLK.x - 34, cy: CLK.y - 36.5, r: 5, fill: "#c0392b" }, gClock);
function setClock(u, opacity) {
  const sec = u * SEC_PER_U;
  clockDigits.textContent = `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, "0")}`;
  liveDot.setAttribute("opacity", 0.5 + 0.5 * Math.sin(u * Math.PI * 0.5) ** 2);
  gClock.setAttribute("opacity", opacity);
}

/* --- recovered topology (scene 2) --- */
const gTopo = el("g", { id: "topo", opacity: 0 }, svg);
function buildGraph(parent, nodes, edges, r, style) {
  const out = { nodes: {}, edges: [] };
  const gE = el("g", { fill: "none" }, parent), gN = el("g", {}, parent);
  for (const e of edges) {
    const [x1, y1] = nodes[e.f], [x2, y2] = nodes[e.t];
    let d, lx, ly;
    if (e.arc) {
      const c = e.arc; const s = toward(x1, y1, c[0], c[1], r + 3), t = toward(x2, y2, c[0], c[1], r + 5);
      d = `M${s[0]},${s[1]} Q${c[0]},${c[1]} ${t[0]},${t[1]}`;
      const m = quad(s, c, t, 0.5); lx = m[0] + e.off[0]; ly = m[1] + e.off[1];
    } else {
      const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
      const s = [x1 + ux * (r + 2), y1 + uy * (r + 2)], t = [x2 - ux * (r + 5), y2 - uy * (r + 5)];
      d = `M${s[0]},${s[1]} L${t[0]},${t[1]}`;
      lx = (s[0] + t[0]) / 2 - uy * 14; ly = (s[1] + t[1]) / 2 + ux * 14;
    }
    const p = el("path", { d, stroke: style.stroke, "stroke-width": style.width, "marker-end": style.marker,
      "stroke-dasharray": e.dashed ? "6 4" : "" }, gE);
    const label = el("text", { x: lx, y: ly + 4, text: "", "font-size": 12.5, "font-weight": "bold", "text-anchor": "middle", fill: style.stroke }, gE);
    if (e.text) el("text", { x: lx + (e.textOff ? e.textOff[0] : 0), y: ly + 4 + (e.textOff ? e.textOff[1] : 0), text: e.text, "font-size": 10.5,
      "font-style": "italic", "text-anchor": "middle", fill: style.stroke }, gE);
    out.edges.push({ e, path: p, label });
  }
  for (const id in nodes) {
    const [x, y] = nodes[id];
    const c = el("circle", { cx: x, cy: y, r, fill: C.act, stroke: C.ink, "stroke-width": 1.8 }, gN);

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let time = reduceMotion ? S1 - 0.6 : 0, playing = !reduceMotion, last = null;
function setPlaying(v) { playing = v; $("play").textContent = v ? "Pause" : "Play"; last = null; }
$("play").onclick = () => setPlaying(!playing);
$("replay").onclick = () => { time = 0; render(time); setPlaying(true); };
document.querySelectorAll(".chip").forEach(c => c.onclick = () => { time = [0, S1, S1 + S2][+c.dataset.scene]; render(time); setPlaying(true); });
$("scrub").oninput = e => { time = e.target.value / 1000 * TOTAL; render(time); setPlaying(false); };
document.addEventListener("visibilitychange", () => { last = null; });
function frame(now) {
  if (playing) { if (last !== null) time += Math.min(0.05, (now - last) / 1000); last = now; }
  render(time);
  requestAnimationFrame(frame);
}
render(time);
setPlaying(playing);
requestAnimationFrame(frame);
</script>
</body>
</html>
